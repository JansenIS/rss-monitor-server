<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RSS Publishing Admin</title>
  <style>
    body{font-family:Arial,sans-serif;max-width:1100px;margin:24px auto;padding:0 16px;line-height:1.45} fieldset{margin:16px 0;padding:16px;border:1px solid #ddd;border-radius:8px} label{display:block;margin:8px 0 4px} input,textarea,select{width:100%;box-sizing:border-box;padding:8px} button{margin-top:10px;padding:10px 14px;cursor:pointer}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.site{border:1px solid #eee;border-radius:8px;padding:12px;margin:8px 0} pre{background:#111;color:#eee;padding:12px;overflow:auto;border-radius:8px}
  </style>
</head>
<body>
  <h1>Headless RSS → RouterAI → WordPress</h1>
  <p>Эту админку можно открыть через FastAPI по /admin или запустить отдельно на пользовательском устройстве.</p>

  <fieldset>
    <legend>Подключение к серверу</legend>
    <div class="row"><div><label>Server URL</label><input id="server" placeholder="http://SERVER_IP:8080"></div><div><label>Bearer token</label><input id="token" type="password"></div></div>
    <button data-action="saveLocal">Сохранить локально в браузере</button> <button data-action="checkApi">Проверить API</button>
  </fieldset>

  <fieldset>
    <legend>RouterAI и общие настройки</legend>
    <div class="row"><div><label>RouterAI key (сохраняется на сервер)</label><input id="routerKey" type="password"></div><div><label>RouterAI base URL</label><input id="routerBase" value="https://routerai.ru/api/v1"></div></div>
    <div class="row"><div><label>LLM модель рерайта</label><input id="rewriteModel" placeholder="например gpt-4o-mini"></div><div><label>Модель изображений</label><input id="imageModel" placeholder="например dall-e-3 / image model"></div></div>
    <label>Язык по умолчанию</label><select id="defaultLanguage"><option value="en">English</option><option value="fr">French</option></select>
    <label>Стоп-слова</label><textarea id="stopWords"></textarea>
    <label>Специфика/тональность</label><textarea id="specificity"></textarea>
    <button data-action="loadSettings">Загрузить</button> <button data-action="saveSettings">Сохранить на сервер</button>
  </fieldset>

  <fieldset>
    <legend>WordPress сайты</legend>
    <div id="sites"></div>
    <h3>Добавить / обновить сайт</h3>
    <input id="siteId" type="hidden">
    <div class="row"><div><label>Название</label><input id="siteName"></div><div><label>WordPress URL</label><input id="siteUrl" placeholder="https://example.com"></div></div>
    <div class="row"><div><label>Username</label><input id="siteUser"></div><div><label>Application password</label><input id="sitePass" type="password"></div></div>
    <div class="row"><div><label>Категории (каждая строка: ID: название)</label><textarea id="siteCategories" placeholder="12: Politics
34: Economy"></textarea></div><div><label>Статус</label><select id="siteStatus"><option>draft</option><option>publish</option><option>pending</option></select></div></div>
    <div class="row"><div><label>Язык сайта</label><select id="siteLanguage"><option value="">Использовать язык задания</option><option value="en">English</option><option value="fr">French</option></select></div><div><label>Активен</label><select id="siteActive"><option value="true">true</option><option value="false">false</option></select></div></div>
    <div class="row"><div><label>Лимит генераций в час</label><input id="siteLimitHour" type="number" min="1"></div><div><label>Лимит генераций за 24 часа</label><input id="siteLimitDay" type="number" min="1"></div></div>
    <label>Специфика сайта</label><textarea id="siteSpecificity"></textarea>
    <button data-action="saveSite">Сохранить сайт</button> <button data-action="clearSiteForm">Очистить</button> <button data-action="loadSites">Обновить список</button>
  </fieldset>

  <fieldset>
    <legend>Запуск публикации</legend>
    <div class="row"><div><label>Код страны</label><input id="countryCode" placeholder="SC"></div><div><label>Название страны (обязательно попадёт в промпт изображения)</label><input id="countryName" placeholder="Seychelles"></div></div>
    <div class="row"><div><label>Язык публикации</label><select id="targetLanguage"><option value="en">English</option><option value="fr">French</option></select></div><div><label>Количество сайтов</label><input id="siteLimit" type="number" min="1"></div></div>
    <div class="row"><div><label>Тип пайплайна</label><select id="pipelineType"><option value="recent">Последний период</option><option value="retrospective">Ретроспективный архив</option></select></div><div><label>Период новостей, часов</label><input id="hoursBack" type="number" min="1" max="24" value="1"></div></div>
    <div class="row"><div><label>Начало архива</label><input id="periodStart" type="date"></div><div><label>Конец архива</label><input id="periodEnd" type="date"></div></div>
    <label>Статей в день на каждый сайт</label><input id="articlesPerDay" type="number" min="1" max="100" placeholder="8">
    <button data-action="previewNews">Показать новости</button> <button data-action="createJob">Создать задание</button>
  </fieldset>

  <fieldset><legend>Задания</legend><button data-action="loadJobs">Обновить задания</button><div id="jobs"></div></fieldset>
  <pre id="log"></pre>

<script>
const $ = id => document.getElementById(id);

function log(x) {
  $('log').textContent = typeof x === 'string' ? x : JSON.stringify(x, null, 2);
}

function showError(error) {
  console.error(error);
  log(`Ошибка: ${error?.message || error}`);
}

function headers() {
  return {
    'Content-Type': 'application/json',
    'Authorization': `Bearer ${$('token').value}`,
  };
}

function serverBaseUrl() {
  const value = $('server').value.trim().replace(/\/$/, '');
  if (!value) {
    throw new Error('Укажите Server URL в блоке подключения к серверу');
  }
  if (!/^https?:\/\//i.test(value)) {
    throw new Error('Server URL должен начинаться с http:// или https://');
  }
  return value;
}

function buildNetworkErrorMessage(error, url) {
  const pageProtocol = window.location.protocol;
  let target;
  try {
    target = new URL(url);
  } catch {
    target = null;
  }

  const hints = [
    'Браузер не смог подключиться к API-серверу.',
    `Проверьте, что адрес API открыт: ${url}`,
    'Проверьте, что FastAPI/контейнер запущен и порт API доступен с этого устройства.',
    'Проверьте Server URL: для /admin обычно это http://SERVER_IP:8080, а для npm-админки на 5173 можно оставить http://SERVER_IP:5173 — npm-сервер проксирует /api/* в FastAPI.',
  ];

  if (pageProtocol === 'https:' && target?.protocol === 'http:') {
    hints.push('Админка открыта по HTTPS, а API указан по HTTP: браузер может блокировать mixed content. Откройте админку по HTTP или настройте HTTPS для API.');
  }

  if (target && !['localhost', '127.0.0.1', '::1'].includes(target.hostname)) {
    hints.push('Если API запущен на другом сервере, проверьте firewall/security group и проброс порта.');
  }

  hints.push('Если запрос виден в Network как CORS/preflight error, разрешите origin админки в API_CORS_ORIGINS или оставьте значение по умолчанию ["*"].');

  return `Ошибка сети: ${error?.message || error}\n\n${hints.map(item => `- ${item}`).join('\n')}`;
}

async function fetchApi(url, options) {
  try {
    return await fetch(url, options);
  } catch (error) {
    throw new Error(buildNetworkErrorMessage(error, url));
  }
}

async function api(path, opts = {}) {
  const url = `${serverBaseUrl()}${path}`;
  log(`Запрос: ${opts.method || 'GET'} ${url}`);
  const response = await fetchApi(url, {
    ...opts,
    headers: {
      ...headers(),
      ...(opts.headers || {}),
    },
  });
  const text = await response.text();
  let body;
  try {
    body = JSON.parse(text);
  } catch {
    body = text;
  }
  if (!response.ok) {
    throw new Error(typeof body === 'string' ? body : JSON.stringify(body));
  }
  return body;
}

function run(action) {
  return async event => {
    event?.preventDefault();
    try {
      await action(event);
    } catch (error) {
      showError(error);
    }
  };
}

function saveLocal() {
  localStorage.rssPubServer = $('server').value;
  localStorage.rssPubToken = $('token').value;
  log('Сохранено локально');
}

function defaultServerUrl() {
  if (window.location.protocol !== 'http:' && window.location.protocol !== 'https:') {
    return '';
  }

  return window.location.origin;
}

function restoreLocal() {
  $('server').value = localStorage.rssPubServer || defaultServerUrl();
  $('token').value = localStorage.rssPubToken || '';
}

async function checkApi() {
  const health = await api('/api/v1/health');
  log({ ok: true, health });
}

async function loadSettings() {
  const settings = await api('/api/v1/publishing/settings');
  $('routerKey').value = settings.routerai_api_key || '';
  $('routerBase').value = settings.routerai_base_url || '';
  $('rewriteModel').value = settings.rewrite_model || '';
  $('imageModel').value = settings.image_model || '';
  $('defaultLanguage').value = ['en', 'fr'].includes(settings.default_language) ? settings.default_language : 'en';
  $('stopWords').value = settings.stop_words || '';
  $('specificity').value = settings.specificity || '';
  log(settings);
}

async function saveSettings() {
  const body = {
    routerai_api_key: $('routerKey').value,
    routerai_base_url: $('routerBase').value,
    rewrite_model: $('rewriteModel').value,
    image_model: $('imageModel').value,
    default_language: $('defaultLanguage').value,
    stop_words: $('stopWords').value,
    specificity: $('specificity').value,
  };
  log(await api('/api/v1/publishing/settings', { method: 'PUT', body: JSON.stringify(body) }));
}

function formatCategories(categories) {
  return (categories || []).map(category => (
    typeof category === 'object' ? `${category.id}: ${category.name}` : String(category)
  )).join(', ');
}

function parseCategories(raw) {
  return raw.split(/\n|,/).map(item => item.trim()).filter(Boolean).map(item => {
    const match = item.match(/^(\d+)\s*[:;-]\s*(.+)$/);
    return match ? { id: parseInt(match[1], 10), name: match[2].trim() } : { id: parseInt(item, 10), name: item };
  }).filter(category => Number.isInteger(category.id) && category.name);
}

function renderSite(site) {
  const wrapper = document.createElement('div');
  wrapper.className = 'site';
  wrapper.innerHTML = `<b></b> <span class="base-url"></span> [<span class="state"></span>]<br>categories: <span class="categories"></span><br>`;
  wrapper.querySelector('b').textContent = site.name;
  wrapper.querySelector('.base-url').textContent = site.base_url;
  wrapper.querySelector('.state').textContent = site.is_active ? 'active' : 'off';
  wrapper.querySelector('.categories').textContent = formatCategories(site.categories);
  const editButton = document.createElement('button');
  editButton.type = 'button';
  editButton.textContent = 'Редактировать';
  editButton.addEventListener('click', () => editSite(site));
  wrapper.appendChild(editButton);
  return wrapper;
}

async function loadSites() {
  const sites = await api('/api/v1/publishing/sites');
  $('sites').replaceChildren(...sites.map(renderSite));
  log(sites);
}

function editSite(site) {
  $('siteId').value = site.id;
  $('siteName').value = site.name;
  $('siteUrl').value = site.base_url;
  $('siteUser').value = site.username || '';
  $('sitePass').value = site.app_password || '';
  $('siteStatus').value = site.default_status || 'draft';
  $('siteCategories').value = (site.categories || []).map(category => (
    typeof category === 'object' ? `${category.id}: ${category.name}` : String(category)
  )).join('\n');
  $('siteLanguage').value = site.language || '';
  $('siteSpecificity').value = site.specificity || '';
  $('siteLimitHour').value = site.generation_limit_per_hour || '';
  $('siteLimitDay').value = site.generation_limit_per_24h || '';
  $('siteActive').value = String(site.is_active);
}

function clearSiteForm() {
  ['siteId', 'siteName', 'siteUrl', 'siteUser', 'sitePass', 'siteCategories', 'siteLanguage', 'siteSpecificity', 'siteLimitHour', 'siteLimitDay'].forEach(id => {
    $(id).value = '';
  });
  $('siteStatus').value = 'draft';
  $('siteActive').value = 'true';
}

async function saveSite() {
  const body = {
    name: $('siteName').value,
    base_url: $('siteUrl').value,
    username: $('siteUser').value,
    app_password: $('sitePass').value,
    default_status: $('siteStatus').value,
    categories: parseCategories($('siteCategories').value),
    language: $('siteLanguage').value,
    specificity: $('siteSpecificity').value,
    generation_limit_per_hour: $('siteLimitHour').value ? parseInt($('siteLimitHour').value, 10) : null,
    generation_limit_per_24h: $('siteLimitDay').value ? parseInt($('siteLimitDay').value, 10) : null,
    is_active: $('siteActive').value === 'true',
  };
  const id = $('siteId').value;
  log(await api(`/api/v1/publishing/sites${id ? `/${id}` : ''}`, { method: id ? 'PUT' : 'POST', body: JSON.stringify(body) }));
  await loadSites();
}

async function previewNews() {
  const params = new URLSearchParams({
    country_code: $('countryCode').value,
    hours_back: $('hoursBack').value,
  });
  log(await api(`/api/v1/publishing/recent-news?${params}`));
}

async function createJob() {
  const body = {
    pipeline_type: $('pipelineType').value,
    country_code: $('countryCode').value,
    country_name: $('countryName').value,
    target_language: $('targetLanguage').value,
    hours_back: parseInt($('hoursBack').value, 10),
    period_start: $('periodStart').value || null,
    period_end: $('periodEnd').value || null,
    articles_per_day: $('articlesPerDay').value ? parseInt($('articlesPerDay').value, 10) : null,
    site_limit: $('siteLimit').value ? parseInt($('siteLimit').value, 10) : null,
  };
  log(await api('/api/v1/publishing/jobs', { method: 'POST', body: JSON.stringify(body) }));
  await loadJobs();
}

function renderJob(job) {
  const wrapper = document.createElement('div');
  wrapper.className = 'site';
  wrapper.innerHTML = `<b></b> <span class="status"></span> <span class="country"></span> → <span class="language"></span><br>planned/site: <span class="planned"></span><br><span class="error"></span><br>`;
  wrapper.querySelector('b').textContent = `#${job.id}`;
  wrapper.querySelector('.status').textContent = job.status;
  wrapper.querySelector('.country').textContent = job.country_code;
  wrapper.querySelector('.language').textContent = job.target_language;
  wrapper.querySelector('.planned').textContent = job.planned_articles_per_site || '-';
  wrapper.querySelector('.error').textContent = job.error_text || '';
  const articlesButton = document.createElement('button');
  articlesButton.type = 'button';
  articlesButton.textContent = 'Публикации';
  articlesButton.addEventListener('click', run(async () => {
    log(await api(`/api/v1/publishing/jobs/${job.id}/articles`));
  }));
  wrapper.appendChild(articlesButton);
  return wrapper;
}

async function loadJobs() {
  const jobs = await api('/api/v1/publishing/jobs');
  $('jobs').replaceChildren(...jobs.map(renderJob));
  log(jobs);
}

const actions = {
  saveLocal,
  checkApi,
  loadSettings,
  saveSettings,
  saveSite,
  clearSiteForm,
  loadSites,
  previewNews,
  createJob,
  loadJobs,
};

for (const [name, action] of Object.entries(actions)) {
  document.querySelectorAll(`[data-action="${name}"]`).forEach(button => {
    button.type = 'button';
    button.addEventListener('click', run(action));
  });
}

restoreLocal();
</script>

</body></html>
